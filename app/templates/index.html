{% extends "base.html" %}
{% block title %}首页 - 房屋租赁系统{% endblock %}

{% block content %}
<div class="hero">
  <h1>智能房屋租赁系统</h1>
  <p>安全可靠的房屋租赁平台，轻松找房、租房、管理房产。</p>
  {% if not current_user.is_authenticated %}
    <a href="{{ url_for('auth.register') }}" class="btn btn-primary">立即注册</a>
  {% else %}
    <a href="{{ url_for('houses.list_houses') }}" class="btn btn-primary">浏览房源</a>
  {% endif %}
</div>
{% endblock %}
