<!doctype html>
<html lang="zh-CN">

    <title>{% block title %}房屋租赁系统{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a href="{{ url_for('main.index') }}">HouseRent</a>
      <nav>
        <a href="{{ url_for('houses.list_houses') }}">房源</a>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
