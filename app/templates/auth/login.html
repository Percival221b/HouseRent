{% extends "base.html" %}
{% block title %}登录 - 房屋租赁系统{% endblock %}

{% block content %}
<div class="auth-card">
  <h1>登录</h1>
  <form method="POST" action="{{ url_for('auth.login') }}">
    <div class="form-group">
      <label for="login_id">邮箱 / 手机号 / 用户名</label>
      <input type="text" id="login_id" name="login_id" required autofocus placeholder="请输入账号">
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" required placeholder="请输入密码">
    </div>
    <div class="form-group">
      <label style="display:flex;align-items:center;gap:6px;font-weight:400;cursor:pointer;">
        <input type="checkbox" name="remember" style="width:auto;"> 记住我
      </label>
    </div>
    <button type="submit" class="btn btn-primary">登录</button>
  </form>
  <p class="text-center mt-16" style="font-size:14px;color:var(--gray-500);">
    还没有账号？<a href="{{ url_for('auth.register') }}">立即注册</a>
  </p>
</div>
{% endblock %}
