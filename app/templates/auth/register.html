{% extends "base.html" %}
{% block title %}注册 - 房屋租赁系统{% endblock %}

{% block content %}
<div class="auth-card">
  <h1>注册</h1>
  <form method="POST" action="{{ url_for('auth.register') }}">
    <div class="form-group">
      <label for="username">用户名</label>
      <input type="text" id="username" name="username" required autofocus
             placeholder="4-20 位字母、数字或下划线" value="{{ request.form.username or '' }}">
    </div>
    <div class="form-group">
      <label for="email">邮箱</label>
      <input type="email" id="email" name="email" required placeholder="用于验证和登录" value="{{ request.form.email or '' }}">
    </div>
    <div class="form-group">
      <label for="phone">手机号 <span style="color:var(--color-text-muted);font-weight:400;">（选填）</span></label>
      <input type="tel" id="phone" name="phone" placeholder="11 位手机号" value="{{ request.form.phone or '' }}">
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" required placeholder="8-20 位，含大小写字母和数字">
    </div>
    <div class="form-group">
      <label for="password_confirm">确认密码</label>
      <input type="password" id="password_confirm" name="password_confirm" required placeholder="再次输入密码">
    </div>
    <div class="form-group">
      <label for="role">注册角色</label>
      <select id="role" name="role">
        <option value="tenant" {% if request.form.role == 'tenant' %}selected{% endif %}>租客</option>
        <option value="landlord" {% if request.form.role == 'landlord' %}selected{% endif %}>房东（需实名审核）</option>
      </select>
    </div>
    <div class="form-group">
      <label for="code">邮箱验证码</label>
      <div class="form-row">
        <input type="text" id="code" name="code" required placeholder="6 位数字">
        <button
          type="submit"
          class="btn btn-secondary btn-sm"
          style="white-space:nowrap;"
          formaction="{{ url_for('auth.send_code') }}"
          formmethod="POST"
          formnovalidate
        >发送验证码</button>
      </div>
    </div>
    <input type="hidden" name="code_type" value="register">
    <button type="submit" class="btn btn-primary mt-16">注册</button>
  </form>
  <p class="text-center mt-16" style="font-size:14px;color:var(--color-text-muted);">
    已有账号？<a href="{{ url_for('auth.login') }}">立即登录</a>
  </p>
</div>
{% endblock %}
